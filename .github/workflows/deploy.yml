name: Build and Deploy to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Required for requesting the OIDC JWT token

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: ${{vars.ECR_REPOSITORY}}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME}}
  ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY}}

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Configure AWS using OIDC (assume IAM role, no static keys)
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-ecs-deploy
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------
      # Verify AWS Account
      # --------------------------------------------------
      - name: Verify AWS Identity
        run: |
          echo "AWS Region: $AWS_REGION"
          aws sts get-caller-identity

      # --------------------------------------------------
      # Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # Build Docker Image
      # --------------------------------------------------
      - name: Build Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            -t "$IMAGE_URI" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # Push Docker Image to ECR
      # --------------------------------------------------
      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker push "$IMAGE_URI"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "Pushed image:"
          echo "$IMAGE_URI"

      # --------------------------------------------------
      # Get Current ECS Task Definition
      # --------------------------------------------------
      - name: Download ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --region "$AWS_REGION" \
            --query 'taskDefinition' \
            --output json > task-definition.json

      # --------------------------------------------------
      # Update Container Image
      # --------------------------------------------------
      - name: Update ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # --------------------------------------------------
      # Deploy to ECS
      # --------------------------------------------------
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # --------------------------------------------------
      # Deployment Complete
      # --------------------------------------------------
      - name: Deployment Complete
        run: |
          echo "======================================"
          echo "ECS Deployment Completed Successfully"
          echo "======================================"
          echo "Cluster : $ECS_CLUSTER"
          echo "Service : $ECS_SERVICE"
          echo "Image   : ${{ steps.build-image.outputs.image }}"
